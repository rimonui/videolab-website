<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Rimon — brand reel v3 (Gr8r Studio)</title>
<style>
  @font-face{font-family:'Funnel Display';src:url(assets/funnel-300.woff2) format('woff2');font-weight:300}
  @font-face{font-family:'Funnel Display';src:url(assets/funnel-400.woff2) format('woff2');font-weight:400}
  @font-face{font-family:'Funnel Display';src:url(assets/funnel-500.woff2) format('woff2');font-weight:500}
  @font-face{font-family:'Funnel Display';src:url(assets/funnel-600.woff2) format('woff2');font-weight:600}
  @font-face{font-family:'Funnel Display';src:url(assets/funnel-700.woff2) format('woff2');font-weight:700}
  @font-face{font-family:'Funnel Display';src:url(assets/funnel-800.woff2) format('woff2');font-weight:800}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
  body{font-family:'Funnel Display',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden}
  .L{position:absolute;inset:0}
  .a{position:absolute}
  .c{left:0;width:1080px;text-align:center;white-space:nowrap}
  .mono{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;letter-spacing:.16em;text-transform:uppercase}
  .caret{display:inline-block;width:7px;border-radius:2px;vertical-align:-0.06em;margin-left:8px}
  .ch{display:inline-block;will-change:transform}
  .gl{position:absolute;background:currentColor}
  .node{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:1.5px solid currentColor;background:inherit}
  #photo,#sil{position:absolute;display:none}
  #fgL{z-index:3} #bgL{z-index:0} #hudL{z-index:6}
  #outline{position:absolute;display:none;overflow:visible}
</style>
</head>
<body>
<div id="stage">
  <div id="bgL" class="L"></div>
  <img id="photo" src="assets/portrait.png">
  <img id="sil" src="assets/silhouette.png">
  <svg id="outline"><path id="outPath" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div id="fgL" class="L"></div>
  <div id="hudL" class="L" style="pointer-events:none"></div>
</div>
<script>
// =====================================================================
//  COPY — edit here
// =====================================================================
const NAME='Tanjim';
const FULL='Tanjim Islam';
const TITLE='Founder & CEO';
const STUDIO='Gr8r Studio';
const ROLES=[['Studio','Founder'],['Product','Designer'],['Framer','Expert'],['Digital','Creator']];
const DISCIPLINES=['Product Design','UX Audit','Brand Identity','Motion Design','Product Engineering','Website Design','AI Workflow Automation','Framer','Next.js','Webflow','Design Systems'];
const TOTAL=62.95;
const C={red:'#FE370B',redDeep:'#D92F08',ink:'#0B0B0C',dark:'#141414',paper:'#F5F5F4',cream:'#F9F3EB',mute:'#8b8b90'};

// =====================================================================
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const eo=k=>1-Math.pow(1-k,3);
const eo5=k=>1-Math.pow(1-k,5);
const eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const eexp=k=>k>=1?1:1-Math.pow(2,-10*k);
const spring=k=>k>=1?1:1-Math.exp(-6*k)*Math.cos(9*k);
const blink=t=>Math.floor(t*2.4)%2===0;
const nTyped=(len,t,a,cps)=>Math.floor(clamp((t-a)*cps,0,len));
const caret=(h,col,on=true)=>`<span class="caret" style="height:${h}px;background:${col};opacity:${on?1:0}"></span>`;
const fill=c=>`<div class="L" style="background:${c}"></div>`;
const hline=(y,x0,x1,col,op=1,w=1.5)=>`<div class="gl" style="left:${x0}px;top:${y}px;width:${Math.max(0,x1-x0)}px;height:${w}px;color:${col};opacity:${op}"></div>`;
const vline=(x,y0,y1,col,op=1,w=1.5)=>`<div class="gl" style="left:${x}px;top:${y0}px;height:${Math.max(0,y1-y0)}px;width:${w}px;color:${col};opacity:${op}"></div>`;
const node=(x,y,col,op=1,bgc='transparent')=>`<div class="node" style="left:${x}px;top:${y}px;color:${col};opacity:${op};background:${bgc}"></div>`;
const mono=(x,y,txt,col,size=15,op=1,extra='')=>`<div class="a mono" style="left:${x}px;top:${y}px;font-size:${size}px;color:${col};opacity:${op};white-space:nowrap;${extra}">${txt}</div>`;
const glow=(x,y,r,col,op)=>`<div class="a" style="left:${x-r}px;top:${y-r}px;width:${2*r}px;height:${2*r}px;border-radius:50%;background:radial-gradient(circle,${col} 0%,transparent 65%);opacity:${op}"></div>`;

// staggered per-letter rise (mask reveal)
function rise(txt,t,start,{stag=.035,dur=.45,dy=1.0,blur=true}={}){
  return [...txt].map((ch,i)=>{const k=eo5(P(t,start+i*stag,start+i*stag+dur));
    return `<span class="ch" style="transform:translateY(${(1-k)*dy*100}%);opacity:${k};${blur?`filter:blur(${(1-k)*8}px)`:''}">${ch===' '?'&nbsp;':ch}</span>`;}).join('');
}
const maskLine=(inner,extra='')=>`<span style="display:inline-block;overflow:hidden;padding:0 .04em .08em;vertical-align:top;${extra}">${inner}</span>`;

// ---------- persistent image layers ----------
const PH=$('photo'), SI=$('sil'), OL=$('outline'), OP=$('outPath');
let OUT={w:1433,h:1881,d:''}, OLEN=1;
function placeImg(el,{x,y,w,op=1,filter='none',blend='normal',clip='none',show=true,z=''}){
  if(!show){el.style.display='none';return;}
  const h=w*OUT.h/OUT.w;
  Object.assign(el.style,{display:'block',left:x+'px',top:y+'px',width:w+'px',height:h+'px',opacity:op,filter,mixBlendMode:blend,clipPath:clip,zIndex:z});
}
function hideImgs(){PH.style.display='none';SI.style.display='none';OL.style.display='none';}

// ---------- tool icons for the floating toolbar ----------
const IC={
 cursor:'<path d="M5 3l14 7-6 2-2 6z" fill="currentColor"/>',
 frame:'<path d="M7 3v18M17 3v18M3 7h18M3 17h18"/>',
 pen:'<path d="M12 19l7-7-7-9-7 9z M12 3v8"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/>',
 shape:'<rect x="4" y="4" width="16" height="16" rx="2"/>',
 text:'<path d="M5 6V4h14v2M12 4v16M9 20h6"/>',
 hand:'<path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12M11 11V4.5a1.5 1.5 0 0 1 3 0V12M14 11.5V6a1.5 1.5 0 0 1 3 0v8c0 4-2.5 7-6 7-3 0-4.5-2-6-4l-2-3c-.8-1.3.8-2.6 2-1.5L8 15"/>',
 comment:'<path d="M4 20l1.5-4A8 8 0 1 1 9 19.5z"/>',
 ai:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z" fill="currentColor"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z" fill="currentColor"/>',
 code:'<path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/>',
};
const icon=(n,x,y,s,col)=>`<svg class="a" style="left:${x-s/2}px;top:${y-s/2}px;color:${col}" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;

// ---------- HUD (persistent, minimal) ----------
const CHAPTERS=[[0,'Intro'],[5.9,'Role'],[9.8,'Mindset'],[15.5,'Services'],[21.65,'Gr8r Studio'],[26.4,'Numbers'],[31.6,'Process'],[37,'AI'],[41.6,'Work'],[46.4,'Insight'],[49.0,'Clients'],[52.0,'Framer'],[54.6,'Identity'],[59.25,'Tanjim']];
function hud(t,dark){
  const col=dark?'rgba(255,255,255,.55)':'rgba(11,11,12,.5)';
  let ci=0; CHAPTERS.forEach((c,i)=>{if(t>=c[0])ci=i;});
  let h='';
  const cm=(x,y,sx,sy)=>`<div class="a" style="left:${x}px;top:${y}px;width:26px;height:26px;border-${sy}:2px solid ${col};border-${sx}:2px solid ${col}"></div>`;
  h+=cm(44,64,'left','top')+cm(1010,64,'right','top')+cm(44,1830,'left','bottom')+cm(1010,1830,'right','bottom');
  h+=mono(86,70,`${STUDIO} — ${NAME}`,col,14);
  h+=`<div class="a mono" style="right:86px;top:70px;font-size:14px;color:${col};white-space:nowrap">${String(ci+1).padStart(2,'0')} / ${CHAPTERS.length} · ${CHAPTERS[ci][1]}</div>`;
  // progress bar
  h+=`<div class="a" style="left:86px;top:1846px;width:908px;height:2px;background:${col};opacity:.35"></div>`;
  h+=`<div class="a" style="left:86px;top:1846px;width:${908*t/TOTAL}px;height:2px;background:${C.red}"></div>`;
  return h;
}

// =====================================================================
//  SCENES — each returns {bg, fg, dark}
// =====================================================================
function grid(t,col,op,g){
  let h='';const Y1=870,Y2=1070;
  h+=hline(Y1,540-540*g,540+540*g,col,op)+hline(Y2,540-540*g,540+540*g,col,op);
  [160,920].forEach(x=>{h+=vline(x,960-560*g,960+560*g,col,op*.6);});
  return h;
}
function sOpen(t){ // 0 – 1.3 dark, cursor, He
  let bg=fill(C.dark)+glow(540,960,700,'rgba(254,55,11,.18)',eo(P(t,0,1.2)));
  const g=eio(P(t,.05,.75)); bg+=grid(t,'#fff',.14,g);
  [160,920].forEach((x,i)=>{const o=P(t,.5+i*.08,.7+i*.08);bg+=node(x,870,'#fff',o*.5,C.dark)+node(x,1070,'#fff',o*.5,C.dark);});
  const s='He'.slice(0,t<.82?0:t<1.0?1:2);
  const fg=`<div class="a c" style="top:885px;font-size:210px;font-weight:700;letter-spacing:-0.04em;color:#fff;line-height:1">${s}${caret(160,C.red,t>.82||blink(t))}</div>`;
  return {bg,fg,dark:true};
}
function sHello(t){ // 1.3 – 2.25
  let bg=fill(C.paper)+grid(t,'#9c9993',.45,1);
  [160,920].forEach(x=>{bg+=node(x,870,'#9c9993',1,C.paper)+node(x,1070,'#9c9993',1,C.paper);});
  bg+=mono(170,1082,'Funnel Display · 700',C.mute,12)+mono(796,846,'210 / -4%',C.mute,12);
  const n=2+nTyped(3,t,1.3,7.5); const dk=spring(P(t,1.82,2.12));
  const fg=`<div class="a c" style="top:885px;font-size:210px;font-weight:700;letter-spacing:-0.04em;color:${C.ink};line-height:1">${'Hello'.slice(0,n)}<span style="display:inline-block;width:44px;height:44px;border-radius:50%;background:${C.red};margin-left:10px;transform:scale(${dk})"></span>${dk<.05?caret(160,C.red):''}</div>`;
  return {bg,fg};
}
function sIntro(t){ // 2.25 – 5.9
  let bg=fill(C.paper), fg='';
  bg+=hline(870,0,1080,'#c9c6c1',.6*(1-P(t,2.25,2.6)))+hline(1070,0,1080,'#c9c6c1',.6*(1-P(t,2.25,2.6)));
  // I'm big -> eyebrow
  const m=eio(P(t,2.55,2.85));
  const imY=lerp(885,560,m), imS=lerp(210,64,m);
  if(t<4.55) fg+=`<div class="a c" style="top:${imY}px;font-size:${imS}px;font-weight:${m>.5?500:700};letter-spacing:-0.03em;color:${C.ink};line-height:1">${t<2.55?rise('I’m',t,2.25,{stag:.04}):'I’m'}</div>`;
  // name typed big
  let nm=NAME.slice(0,nTyped(NAME.length,t,2.9,10));
  if(t>4.3) nm=NAME.slice(0,Math.max(0,NAME.length-nTyped(NAME.length,t,4.3,22)));
  if(t>2.85 && t<4.55) fg+=`<div class="a c" style="top:640px;font-size:250px;font-weight:700;letter-spacing:-0.05em;color:${C.ink};line-height:1">${nm}${caret(190,C.red,t<3.45||blink(t))}</div>`;
  // title pill
  const pk=eo5(P(t,3.5,3.9))*(1-eio(P(t,4.25,4.45)));
  if(pk>0) fg+=`<div class="a" style="left:50%;top:925px;transform:translateX(-50%) translateY(${(1-pk)*30}px) scale(${lerp(.9,1,pk)});opacity:${pk};display:flex;gap:14px;align-items:center;background:${C.ink};color:#fff;border-radius:999px;padding:16px 30px 16px 18px;font-size:30px;font-weight:500;white-space:nowrap">
    <span style="width:14px;height:14px;border-radius:50%;background:${C.red};box-shadow:0 0 0 6px rgba(254,55,11,.25)"></span>${TITLE} <span style="opacity:.5">· ${STUDIO}</span></div>`;
  // silhouette: pen draws outline 3.4–4.3, fill 4.3–4.55, photo scan reveal 4.6–5.2, slides down 5.55–5.9
  const W=760, X=540-W/2, H=W*OUT.h/OUT.w, Y=1920-H+40;
  const down=eio(P(t,5.55,5.9))*H;
  const draw=eio(P(t,3.35,4.35));
  if(t>3.35){
    Object.assign(OL.style,{display:'block',left:X+'px',top:Y+down+'px',width:W+'px',height:H+'px'});
    OL.setAttribute('viewBox',`0 0 ${OUT.w} ${OUT.h}`);
    OP.setAttribute('stroke',C.red);OP.setAttribute('stroke-width',5);
    OP.style.strokeDasharray=OLEN; OP.style.strokeDashoffset=OLEN*(1-draw); OL.style.opacity=1-P(t,4.35,4.6);
    const f=eo(P(t,4.25,4.6));
    const scan0=eio(P(t,4.65,5.25)); placeImg(SI,{x:X,y:Y+down,w:W,op:f,clip:`inset(0 0 ${scan0*100}% 0)`});
    const scan=eio(P(t,4.65,5.25));
    if(scan>0){ placeImg(PH,{x:X,y:Y+down,w:W,op:1,filter:'grayscale(1) contrast(1.15)',clip:`inset(${(1-scan)*100}% 0 0 0)`});
      if(scan<1) fg+=`<div class="a" style="left:${X}px;top:${Y+down+H*(1-scan)-2}px;width:${W}px;height:4px;background:${C.red};box-shadow:0 0 30px ${C.red}"></div>`;
    }
    if(draw>0&&draw<1){const p=OP.getPointAtLength(OLEN*draw);const sx=X+p.x*W/OUT.w, sy=Y+p.y*H/OUT.h;
      fg+=`<div class="a" style="left:${sx-9}px;top:${sy-9}px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid ${C.red}"></div>`+mono(sx+18,sy-34,'Pen',C.red,12);}
    if(t>3.4&&t<4.6) fg+=mono(86,1300,`Vector · ${NAME.toLowerCase()}.svg`,C.mute,12,1-P(t,4.4,4.6));
  }
  // I'm your
  if(t>4.55){
    const s='I’m a'; const n=nTyped(s.length,t,4.6,15);
    fg+=`<div class="a c" style="top:640px;font-size:150px;font-weight:600;letter-spacing:-0.04em;color:${C.ink};line-height:1">${s.slice(0,n).replace(/ a$/,' <span style="font-weight:300">a</span>')}${caret(120,C.red,blink(t))}</div>`;
  }
  return {bg,fg};
}
function sRoles(t){ // 5.9 – 8.7, each role uses a different transition
  const looks=[[C.paper,C.ink,C.red],[C.dark,'#fff',C.red],[C.cream,C.ink,C.red],[C.red,'#fff',C.ink]];
  const seg=(8.7-5.9)/4, i=Math.min(3,Math.floor((t-5.9)/seg)), t0=5.9+i*seg, k=P(t,t0,t0+.32);
  const [b,f,acc]=looks[i]; const prev=i>0?looks[i-1]:null;
  let bg='', fg='';
  const role=(j,col,dy=0,op=1)=>{const [a,w]=ROLES[j];return `<div class="a c" style="top:${880+dy}px;font-size:118px;letter-spacing:-0.04em;color:${col};opacity:${op};line-height:1">${maskLine(`<span style="font-weight:300">${a}</span>`)} ${maskLine(`<span style="font-weight:700">${w}</span>`)}</div>`;};
  if(i===0){ bg=fill(b); fg+=`<div class="a c" style="top:880px;font-size:118px;letter-spacing:-0.04em;color:${f};line-height:1"><span style="font-weight:300">${rise(ROLES[0][0],t,5.9)}</span> <span style="font-weight:700">${rise(ROLES[0][1],t,6.05)}</span></div>`; }
  else{
    bg=fill(prev[0]);
    const e=eexp(k);
    if(i===1){ // circle reveal from center
      bg+=`<div class="L" style="background:${b};clip-path:circle(${e*120}% at 50% 50%)"></div>`;
    } else if(i===2){ // shutter slats
      bg+=[0,1,2,3,4].map(s=>`<div class="a" style="left:0;top:${s*384}px;width:1080px;height:384px;background:${b};transform:scaleX(${eexp(clamp((k*1.6)-s*.12))});transform-origin:${s%2?'right':'left'}"></div>`).join('');
    } else { // vertical push
      bg+=`<div class="L" style="background:${b};transform:translateY(${(1-e)*100}%)"></div>`;
    }
    if(k<1) fg+=`<div class="L" style="clip-path:inset(0 0 0 0)">${role(i-1,prev[1],-e*90,1-e)}</div>`;
    const r=eo5(P(t,t0+.08,t0+.42)); fg+=role(i,f,(1-r)*110,r);
  }
  // index + label
  fg+=mono(86,830,`Role — 0${i+1}`,f,15,.6)+`<div class="a" style="left:86px;top:1150px;display:flex;gap:10px">${ROLES.map((_,j)=>`<div style="width:${j===i?54:18}px;height:6px;border-radius:3px;background:${j===i?acc:f};opacity:${j===i?1:.25}"></div>`).join('')}</div>`;
  return {bg,fg,dark:i===1||i===3};
}
function sChip(t){ // 8.7 – 9.8: name -> profile chip with avatar
  let bg=fill(C.paper), fg='';
  const a=eo5(P(t,8.7,9.0)), k=eio(P(t,9.15,9.5));
  const size=lerp(250,46,k);
  // chip container grows around the name
  const cw=lerp(0,430,k), ch=lerp(0,104,k);
  if(k>0) fg+=`<div class="a" style="left:${540-cw/2}px;top:${960-ch/2}px;width:${cw}px;height:${ch}px;border-radius:999px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,${.12*k}),0 0 0 1px rgba(0,0,0,.06)"></div>`;
  fg+=`<div class="a c" style="top:${960-size*.55}px;font-size:${size}px;font-weight:700;letter-spacing:-0.045em;color:${C.ink};line-height:1;transform:translateX(${k*40}px);opacity:${a};filter:blur(${(1-a)*12}px)">${NAME}</div>`;
  if(k>.6){const o=P(k,.6,1); const ax=540-cw/2+14;
    placeImg(PH,{x:ax-8,y:960-38,w:76,op:o,filter:'grayscale(1)',clip:'circle(38% at 50% 32%)',z:5});
    fg+=mono(540+60,940,'● online',C.red,12,o*0)+`<div class="a" style="left:${540+cw/2-56}px;top:${960-14}px;width:28px;height:28px;border-radius:50%;background:${C.red};opacity:${o};display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px">✓</div>`;}
  return {bg,fg};
}
function rings(col,op){let h='';[320,540].forEach(r=>{h+=`<div class="a" style="left:${540-r}px;top:${960-r}px;width:${2*r}px;height:${2*r}px;border-radius:50%;border:1.5px solid ${col};opacity:${op}"></div>`;});return h;}
function sQuote(t){ // 9.8 – 15.5 on red
  let bg=fill(C.red)+glow(820,560,700,'rgba(255,190,160,.35)',1)+glow(200,1500,600,'rgba(120,10,0,.35)',1)+rings('#fff',.12), fg='';
  // red circle wipe in from the chip
  const wi=eexp(P(t,9.8,10.15)); if(wi<1) bg=fill(C.paper)+`<div class="L" style="clip-path:circle(${wi*120}% at 50% 50%)">${bg}</div>`;
  const sel=(on)=>on?`outline:2px solid #fff;outline-offset:10px;`:'';
  const handle=(on)=>on?`<i style="position:absolute;left:-16px;top:-16px;width:12px;height:12px;background:${C.red};border:2px solid #fff"></i><i style="position:absolute;right:-16px;bottom:-16px;width:12px;height:12px;background:${C.red};border:2px solid #fff"></i>`:'';
  const W=(txt,at,{bold=false,box=false,acc=false}={})=>{const k=eo5(P(t,at,at+.35));
    return `<span style="position:relative;display:inline-block;margin:0 .13em;opacity:${k};transform:translateY(${(1-k)*40}px);filter:blur(${(1-k)*8}px);font-weight:${bold?700:300};color:${acc?C.ink:'#fff'};${sel(box)}">${txt}${handle(box)}</span>`;};
  const line=(y,html,op=1,size=112)=>`<div class="a c" style="top:${y}px;font-size:${size}px;letter-spacing:-0.04em;line-height:1;opacity:${op}">${html}</div>`;
  if(t<11.5){
    fg+=line(850,W('Stay',10.05)+W('hungry,',10.35,{box:t>10.35&&t<10.75,acc:true}));
    fg+=line(985,W('stay',10.75)+W('humble.',11.0,{box:t>11.0,acc:true}));
  } else if(t<13.5){
    // floating toolbar with hopping active state + cursor

function render(t){

  else if(t<31.6) r=sStats(t);
  else if(t<37.0) r=sProcess(t);
  else if(t<41.6) r=sAI(t);

}
